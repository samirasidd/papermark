name: IDOR smoke test

on:
  pull_request:
  push:
    branches: [ci-idor-smoke-test]

jobs:
  idor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: papermark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
      srh:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci_srh_token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    env:
      NEXTAUTH_SECRET: ci-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/papermark
      POSTGRES_PRISMA_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/papermark
      POSTGRES_PRISMA_SHADOW_URL: postgresql://postgres:postgres@localhost:5432/papermark
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: ci_srh_token
      UPSTASH_REDIS_REST_LOCKER_URL: http://localhost:8079
      UPSTASH_REDIS_REST_LOCKER_TOKEN: ci_srh_token
      RESEND_API_KEY: re_ci_dummy
      NEXT_PUBLIC_WEBHOOK_BASE_HOST: localhost
      NEXT_PUBLIC_APP_BASE_HOST: localhost
      NEXT_PUBLIC_MARKETING_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:

          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Start app
        run: nohup npm run dev > app.log 2>&1 &
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/auth/providers > /dev/null && exit 0
            sleep 3
          done
          tail -n 80 app.log
          exit 1
      - name: IDOR smoke test
        run: node scripts/idor-smoke-test.mjs
      - name: App log on failure
        if: failure()
        run: tail -n 80 app.log

name: Unit tests

on:
  pull_request:
  push:
    branches: [ci-permissions-test]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run permission tests
        run: npx --yes tsx@4.22.3 --test lib/api/rbac/permissions.test.ts
